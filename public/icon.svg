<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#042f2e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle / tile -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" />

  <!-- Subtle glow inner ring -->
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" />

  <!-- Heart Handshake / Care Icon (Lucide style) centered within safe zone (80%) -->
  <g filter="url(#shadow)" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(106, 86) scale(2.5)">
    <!-- Heart outline -->
    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
    <!-- Handshake inner details -->
    <path d="M12 5 9.04 7.96a2.17 2.17 0 0 0 0 3.08v0c.82.82 2.13.85 3 .07l2.07-1.9" />
    <path d="m14 15-3-3" />
    <path d="m15 12-2-2" />
    <path d="m17 10-2-2" />
  </g>

  <!-- Brand Typography: AN SANH -->
  <g text-anchor="middle">
    <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="4" fill="#ffffff">AN SANH</text>
    <text x="256" y="458" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#a7f3d0">CARE &amp; CLINIC</text>
  </g>
</svg>
